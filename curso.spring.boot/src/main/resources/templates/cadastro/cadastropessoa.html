<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<title>Pagina de cadastro pessoa</title>
<link rel="stylesheet" href="/bootstrap-4.6.2-dist/css/bootstrap.min.css" >
</head>
<body>
	
	<form action="/salvarpessoa" method="post">
		<div class="card">
  			<div class="card-header">
    			<h1>Cadastro de pessoa</h1>
  			</div>
			<div class="card-body">
				<div class="form-group">
		    		<label for="validationCustom02">Nome</label>
		    		<input type="text" class="form-control" id="validationCustom02" required >
		    		<small id="nome" class="form-text text-muted">informe o nome do usuário.</small>
		    		<div class="invalid-feedback">
        				por favor Informe o Nome:
      				</div>
      				<div class="valid-feedback">
        				OK!
      				</div>
		  		</div>
				<div class="form-group">
		    		<label for="sobrenome">Sobrenome</label>
		    		<input type="text" class="form-control" id="sobrenome" >
		    		<small id="sobrenome" class="form-text text-muted">informe  o sobrenome do usuário.</small>
		  		</div>
				
				<div class="form-group">
		    		<label for="idade">Idade</label>
		    		<input type="number" class="form-control" id="idade" >
		    		<small id="idade" class="form-text text-muted">informe a idade do usuário.</small>
		  		</div>
		  		<button type="submit" class="btn btn-primary">Salvar</button>
		  	</div>
		  </div>
		
	</form>
	<div class="card">
		<table class="table">
			<thead>
	    		<tr>
	      			<th scope="col">ID</th>
	      			<th scope="col">Nome</th>
	      			<th scope="col">Sobrenome</th>
	      			<th scope="col">Idade</th>
	    		</tr>
	  		</thead>
	  		<tbody>
				<tr th:each = "pessoa : ${pessoas}">
					<td th:text = "${pessoa.id}"></td>
					<td th:text = "${pessoa.nome}"></td>
					<td th:text = "${pessoa.sobrenome}"></td>
					<td th:text = "${pessoa.idade}"></td>
				</tr>
			</tbody>
		</table>
	</div>
	<script>
		// Example starter JavaScript for disabling form submissions if there are invalid fields
	(function() {
  	'use strict';
  	window.addEventListener('load', function() {
    	// Fetch all the forms we want to apply custom Bootstrap validation styles to
    	var forms = document.getElementsByClassName('needs-validation');
    	// Loop over them and prevent submission
    	var validation = Array.prototype.filter.call(forms, function(form) {
	      form.addEventListener('submit', function(event) {
	        if (form.checkValidity() === false) {
	          event.preventDefault();
	          event.stopPropagation();
	        }
	        form.classList.add('was-validated');
	      }, false);
	    });
	  }, false);
	})();
</script>
	<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="/bootstrap-4.6.2-dist/js/bootstrap.bundle.min.js" ></script>
	
</body>
</html>
